<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-label="ESCAPERIOM" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="160" /> <!--fill="#F8FAFC"-->

  <!-- Emblem: top-down room + labyrinth, exit at the top-right corner -->
  <g transform="translate(40,20)" fill="none" stroke-width="10" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- outer walls with open corner (exit) -->
    <path d="M75 5 H5 V115 H115 V55" stroke="#14B8A6"/>
    <!-- inner ring with offset opening -->
    <path d="M85 55 V85 H35 V35 H65" stroke="#14B8A6"/>
    <!-- modular connector between rings -->
    <path d="M60 85 V115" stroke="#14B8A6"/>
    <!-- puzzle core -->
    <rect x="50" y="50" width="20" height="20" fill="#38BDF8" stroke="none"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(0,20)" fill="none" stroke="#111827" stroke-width="11" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4">
    <!-- E -->
    <path d="M224 36 H190 V84 H224 M190 60 H218"/>
    <!-- S -->
    <path d="M281 36 H247 V60 H281 V84 H247"/>
    <!-- C -->
    <path d="M338 36 H304 V84 H338"/>
    <!-- A -->
    <path d="M361 84 L374 36 H382 L395 84 M367 68 H389"/>
    <!-- P -->
    <path d="M418 84 V36 H452 V60 H418"/>
    <!-- E -->
    <path d="M509 36 H475 V84 H509 M475 60 H503"/>
    <!-- R -->
    <path d="M532 84 V36 H566 V60 H532 M546 60 L566 84"/>
    <!-- I -->
    <path d="M589 36 V84"/>
    <!-- O: room with puzzle core -->
    <rect x="612" y="36" width="34" height="48"/>
    <rect x="623" y="54" width="12" height="12" fill="#38BDF8" stroke="none"/>
    <!-- M -->
    <path d="M669 84 V36 L691 62 L713 36 V84"/>
  </g>
</svg>