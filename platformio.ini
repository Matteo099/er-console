; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1-n16r8v-debug

[env:esp32-s3-devkitc-1-n16r8v]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
build_src_filter =
    +<*>
    -<main_stress_test.cpp>
    -<main_sd_probe.cpp>
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
	lvgl/lvgl@9.4.0
	lovyan03/LovyanGFX@1.2.19
	https://github.com/lua/lua.git
	adafruit/Adafruit NeoPixel@^1.15.2
	bblanchon/ArduinoJson@^7.2.1
	adafruit/Adafruit INA219@^1.2.3
	miguelbalboa/MFRC522@^1.4.12
	adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
	adafruit/Adafruit PWM Servo Driver Library@^3.0.3
extra_scripts = 
	pre:scripts/2.sync_display_configs.py
	pre:scripts/3.remove_onelua.py
	pre:scripts/4.git_rev.py
build_flags = 
	-DLUA_32BITS
	-DLUA_USE_C89
	-DLUA_USE_LONGJMP
	-UARDUINO_USB_CDC_ON_BOOT
	-D APP_VERSION=\"1.0.0\"
	-DconfigGENERATE_RUN_TIME_STATS=1
	-DconfigUSE_TRACE_FACILITY=1
	-DconfigTASKLIST_INCLUDE_COREID=1

[env:esp32-s3-devkitc-1-n16r8v-debug]
extends = env:esp32-s3-devkitc-1-n16r8v
build_type = debug
build_flags =
	${env:esp32-s3-devkitc-1-n16r8v.build_flags}
	-DCORE_DEBUG_LEVEL=5

; Standalone SD comparison: same wiring, no OS/UI/network libraries.
[env:esp32-s3-devkitc-1-n16r8v-sd-probe]
extends = env:esp32-s3-devkitc-1-n16r8v-debug
build_src_filter =
    -<*>
    +<main_sd_probe.cpp>
lib_deps =
extra_scripts =

