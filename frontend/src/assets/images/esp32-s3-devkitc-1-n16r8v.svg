<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boardFill" x1="300" y1="240" x2="1300" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="wireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; fill: #E2E8F0; }
      .subtitle { font-size: 16px; fill: #93C5FD; }
      .pin-label { font-family: Consolas, monospace; font-size: 12px; font-weight: 700; fill: #1E293B; text-anchor: middle; }
      .pin-pad { stroke: #334155; stroke-width: 1.5; }
      .pin-default { fill: #CBD5E1; }
      .pin-power { fill: #64748B; }
      .pin-tft { fill: #2563EB; }
      .pin-spi { fill: #4F46E5; }
      .pin-touch { fill: #6366F1; }
      .pin-sd { fill: #0F766E; }
      .pin-i2s { fill: #D97706; }
      .pin-i2c { fill: #16A34A; }
      .pin-led { fill: #C026D3; }
      .wire { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: url(#wireGlow); }
      .wire-tft { stroke: #2563EB; }
      .wire-spi { stroke: #4F46E5; }
      .wire-touch { stroke: #6366F1; }
      .wire-sd { stroke: #0F766E; }
      .wire-i2s { stroke: #D97706; }
      .wire-i2c { stroke: #16A34A; }
      .wire-led { stroke: #C026D3; }
      .box-title { font-size: 20px; font-weight: 700; fill: #0F172A; }
      .box-line { font-size: 13px; fill: #1E293B; }
      .legend { font-size: 13px; fill: #CBD5E1; }
    </style>
  </defs>

