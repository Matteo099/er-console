name: Build and release

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate conventions and release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/ci/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --prefix scripts/ci
      - name: Validate new commits and pull request title
        run: npm run check:commits --prefix scripts/ci
      - name: Test release ordering and SemVer
        run: npm test --prefix scripts/ci
      - name: Test packaging, metadata and asset inclusion
        run: python -m unittest discover -s scripts/ci -p "test_*.py" -v
      - name: Validate firmware and game translations
        run: |
          python scripts/checks/check_translations.py
          python scripts/checks/check_game_translations.py

  build:
    name: Build development bundle
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ci/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/ci/requirements.txt') }}
      - run: python -m pip install -r scripts/ci/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Build firmware, portal and complete SD image
        run: python scripts/ci/build_bundle.py --channel dev
      - name: Upload development artifacts (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: escaperiom-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish stable release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            scripts/ci/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ci/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/ci/requirements.txt') }}
      - run: npm ci --prefix scripts/ci
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install -r scripts/ci/requirements.txt
      - name: Determine version, prepare stable bundle, then publish
        run: npm run release --prefix scripts/ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ER_BUILD_BRANCH: main
