name: Build Firmware CI + Release

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # Setup Node (frontend)
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -------------------------
      # Setup PlatformIO
      # -------------------------
      - name: Install PlatformIO
        run: pip install platformio

      # -------------------------
      # Metadata
      # -------------------------
      - name: Set metadata
        run: |
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "DEV_MODE=0" >> $GITHUB_ENV
          else
            echo "DEV_MODE=1" >> $GITHUB_ENV
          fi

      # -------------------------
      # Version (dev)
      # -------------------------
      - name: Extract version
        run: |
          VERSION=$(git describe --tags --abbrev=0 || echo "1.0.0")
          echo "APP_VERSION=$VERSION-dev" >> $GITHUB_ENV

      # -------------------------
      # Inject version into firmware
      # -------------------------
      - name: Inject version into PlatformIO config
        run: |
          sed -i 's/-D APP_VERSION=\\".*\\"/-D APP_VERSION=\\"'"$APP_VERSION"'\\"/' platformio.ini
          if ! grep -q "APP_VERSION" platformio.ini; then
            echo "build_flags = -D APP_VERSION=\\\"$APP_VERSION\\\"" >> platformio.ini
          fi

      # -------------------------
      # Build frontend (correct order)
      # -------------------------
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          jq --arg v "$APP_VERSION" '.version = $v' package.json > tmp.json
          mv tmp.json package.json
          npm run build

      # -------------------------
      # Package frontend
      # -------------------------
      - name: Package frontend
        run: |
          cd frontend/dist
          zip -r ../../www.zip .

      # -------------------------
      # Build firmware
      # -------------------------
      - name: Build firmware (dev)
        run: pio run

      # -------------------------
      # Artifact naming
      # -------------------------
      - name: Set artifact name
        run: |
          SAFE_NAME=$(echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr '/' '-' )
          echo "ARTIFACT_NAME=$SAFE_NAME" >> $GITHUB_ENV

      # -------------------------
      # Upload firmware
      # -------------------------
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.ARTIFACT_NAME }}
          path: .pio/build/*/firmware.bin

      # -------------------------
      # Upload frontend
      # -------------------------
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ env.ARTIFACT_NAME }}
          path: www.zip

  # =========================================================
  # RELEASE JOB
  # =========================================================
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # Setup Node
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -------------------------
      # Setup PlatformIO
      # -------------------------
      - name: Install PlatformIO
        run: pip install platformio

      # -------------------------
      # Semantic release
      # -------------------------
      - name: Install semantic-release
        run: |
          npm install -g semantic-release \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # Version (release)
      # -------------------------
      - name: Extract version
        run: |
          VERSION=$(git describe --tags --abbrev=0 || echo "1.0.0")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      # -------------------------
      # Inject version (firmware + frontend)
      # -------------------------
      - name: Inject version into PlatformIO + frontend
        run: |
          sed -i 's/-D APP_VERSION=\\".*\\"/-D APP_VERSION=\\"'"$APP_VERSION"'\\"/' platformio.ini
          if ! grep -q "APP_VERSION" platformio.ini; then
            echo "build_flags = -D APP_VERSION=\\\"$APP_VERSION\\\"" >> platformio.ini
          fi

          cd frontend
          jq --arg v "$APP_VERSION" '.version = $v' package.json > tmp.json
          mv tmp.json package.json

      # -------------------------
      # Commit version bump
      # -------------------------
      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add platformio.ini frontend/package.json
          git commit -m "chore: bump version to $APP_VERSION" || echo "No changes"
          git push origin main

      # -------------------------
      # Build frontend
      # -------------------------
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Package frontend
        run: |
          cd frontend/dist
          zip -r ../../www.zip .

      # -------------------------
      # Build firmware
      # -------------------------
      - name: Build firmware (release)
        run: pio run

      # -------------------------
      # Upload release assets
      # -------------------------
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .pio/build/*/firmware.bin
            www.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}