name: Build Firmware CI + Release

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PlatformIO
        run: pip install platformio

      # CI only metadata via env (NOT build flags)
      - name: Set metadata
        run: |
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "DEV_MODE=0" >> $GITHUB_ENV
          else
            echo "DEV_MODE=1" >> $GITHUB_ENV
          fi

      # 1. Compute version
      - name: Extract version
        run: |
          VERSION=$(git describe --tags --abbrev=0 || echo "1.0.0")
          echo "APP_VERSION=$VERSION-dev" >> $GITHUB_ENV

      # 2. Write version into platformio.ini
      - name: Inject version into PlatformIO config
        run: |
          sed -i 's/-D APP_VERSION=\\".*\\"/-D APP_VERSION=\\"'"$APP_VERSION"'\\"/' platformio.ini

          # fallback if no build_flags line exists
          if ! grep -q "APP_VERSION" platformio.ini; then
            echo "build_flags = -D APP_VERSION=\\\"$APP_VERSION\\\"" >> platformio.ini
          fi

      - name: Build firmware (dev)
        run: pio run

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}
          path: .pio/build/*/firmware.bin

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: |
          npm install -g semantic-release \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 1. Compute version
      - name: Extract version
        run: |
          VERSION=$(git describe --tags --abbrev=0 || echo "1.0.0")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      # 2. Write version into platformio.ini (NEW STEP)
      - name: Inject version into PlatformIO config
        run: |
          sed -i 's/-D APP_VERSION=\\".*\\"/-D APP_VERSION=\\"'"$APP_VERSION"'\\"/' platformio.ini

          # fallback if no build_flags line exists
          if ! grep -q "APP_VERSION" platformio.ini; then
            echo "build_flags = -D APP_VERSION=\\\"$APP_VERSION\\\"" >> platformio.ini
          fi

      # 3. Commit version bump (ONLY MAIN)
      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add platformio.ini
          git commit -m "chore: bump firmware version to $APP_VERSION" || echo "No changes to commit"
          git push origin main

      # 4. Build release firmware (NO FLAGS PASSED)
      - name: Build firmware (release)
        run: pio run

      # 5. Upload release
      - name: Upload release firmware
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/*/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}