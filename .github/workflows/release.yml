name: Build Firmware CI + Release

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]   # 👈 ALL feature branches + PRs

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install PlatformIO
      - name: Install PlatformIO
        run: pip install platformio

      # 3. Set build metadata (always safe for CI)
      - name: Set metadata
        run: |
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "DEV_MODE=0" >> $GITHUB_ENV
          else
            echo "DEV_MODE=1" >> $GITHUB_ENV
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "CI_MODE=PR" >> $GITHUB_ENV
          else
            echo "CI_MODE=CI" >> $GITHUB_ENV
          fi

      # 4. Build firmware ONLY (no release logic here)
      - name: Build firmware
        run: |
          pio run \
            --project-option="build_flags=
              -D GIT_HASH=\\\"$GIT_HASH\\\"
              -D GIT_BRANCH=\\\"$GIT_BRANCH\\\"
              -D DEV_MODE=$DEV_MODE
              -D CI_MODE=\\\"$CI_MODE\\\""

      # 5. Rename firmware
      - name: Rename firmware
        run: |
          mkdir -p output
          cp .pio/build/*/firmware.bin output/firmware_${GIT_BRANCH}_${GIT_HASH}.bin

      # 6. Upload artifact (useful for PR testing)
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.GIT_BRANCH }}
          path: output/*.bin

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: |
          npm install -g semantic-release \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator

      - name: Run semantic-release
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version env
        run: |
          VERSION=$(git describe --tags --abbrev=0 || echo "dev")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build release firmware
        run: |
          pio run \
            --project-option="build_flags=-D APP_VERSION=\\\"$APP_VERSION\\\""

      - name: Upload release firmware
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/*/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}